# Lädt die Website bei jedem Push per FTPS zu ALL-INKL hoch (Ordner /wohlfuehlraum-sunny.de/).
# Benötigte Repository-Secrets (Settings > Secrets and variables > Actions):
#   FTP_USERNAME  – FTP-Benutzer aus dem KAS (z. B. f0…)
#   FTP_PASSWORD  – Passwort dieses FTP-Benutzers
name: Deploy zu ALL-INKL

on:
  push:
    branches: [claude/new-session-xv9mjl]
  workflow_dispatch:

concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets prüfen
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::FTP_USERNAME und FTP_PASSWORD fehlen in den Repository-Secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w022499d.kasserver.com
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            *.md
            firebase.json
            .firebaserc
            firestore.rules
            firestore.indexes.json
            *.zip
